<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />

  <title>好奇學學 · Curiosity Hub</title>
  <link rel="stylesheet" href="styles.css?v=32" />
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <div class="kicker">CURIOSITY HUB</div>
        <h1>好奇學學</h1>
        <p class="subtitle">網站、想法與論文精選（持續更新）</p>
        <a class="social" href="https://www.threads.com/@daddyatthedesk" target="_blank" rel="noopener">Threads · @daddyatthedesk</a>
      </div>
      <div class="partner-wrap">
        <span class="partner-kicker">廣告贊助：</span>

        <div class="chips ages" id="ages"></div>
      </div>
      <div class="stats" id="stats"></div>

    <footer>資料收集：<a href="https://www.threads.com/@daddyatthedesk" target="_blank" rel="noopener">@daddyatthedesk</a></footer>
